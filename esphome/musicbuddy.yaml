            x: 196
            y: 96
            width: 58
            height: 12
            min_value: 0
            max_value: 100
            value: 50
            bg_color: 0x000000
            border_width: 1
            border_color: 0xFFFFFF
            indicator:
              bg_color: 0xFFFFFF
        - button:

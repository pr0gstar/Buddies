    - id: face_page
      skip: true
      scrollable: false
      on_load:
        - lambda: |-
            id(face_visible) = true;
            id(face_mood) = -1;  // force the mood to be applied again
        - script.execute: update_face_mood
      on_unload:
        - lambda: "id(face_visible) = false;"
      on_click:
        - lvgl.page.show: player_page
      widgets:
        # Eyes are not clickable so a tap anywhere reaches the page
        - obj:
            id: left_eye
            align: CENTER
            x: -${eye_offset_x}
            y: ${eye_offset_y}
            width: ${eye_size}
            height: ${eye_size}
            styles: eye_style
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  id: pupil_left
                  align: CENTER
                  width: ${pupil_size}
                  height: ${pupil_size}
                  radius: ${pupil_radius}
                  styles: lid_style
                  scrollable: false
                  clickable: false
                  widgets:
                    # Glint: small highlight in the upper right of the pupil
                    - obj:
                        align: TOP_RIGHT
                        x: -5
                        y: 5
                        width: ${glint_size}
                        height: ${glint_size}
                        radius: 5
                        bg_color: ${eye_color}
                        bg_opa: COVER
                        border_width: 0
                        clickable: false
              - obj:
                  id: top_lid_left
                  align: TOP_MID
                  width: 100%
                  height: 40
                  styles: lid_style
                  clickable: false
                  hidden: true
              # Happy: big circle below the eye cuts it into an arc
              - obj:
                  id: cheek_lid_left
                  align: BOTTOM_MID
                  y: 92
                  width: 154
                  height: 154
                  radius: 77
                  styles: lid_style
                  clickable: false
                  hidden: true
              - obj:
                  id: bottom_lid_left
                  align: BOTTOM_MID
                  width: 100%
                  height: 20
                  styles: lid_style
                  clickable: false
                  hidden: true
        - obj:
            id: right_eye
            align: CENTER
            x: ${eye_offset_x}
            y: ${eye_offset_y}
            width: ${eye_size}
            height: ${eye_size}
            styles: eye_style
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  id: pupil_right
                  align: CENTER
                  width: ${pupil_size}
                  height: ${pupil_size}
                  radius: ${pupil_radius}
                  styles: lid_style
                  scrollable: false
                  clickable: false
                  widgets:
                    # Glint: small highlight in the upper right of the pupil
                    - obj:
                        align: TOP_RIGHT
                        x: -5
                        y: 5
                        width: ${glint_size}
                        height: ${glint_size}
                        radius: 5
                        bg_color: ${eye_color}
                        bg_opa: COVER
                        border_width: 0
                        clickable: false
              - obj:
                  id: top_lid_right
                  align: TOP_MID
                  width: 100%
                  height: 40
                  styles: lid_style
                  clickable: false
                  hidden: true
              # Happy: big circle below the eye cuts it into an arc
              - obj:
                  id: cheek_lid_right
                  align: BOTTOM_MID
                  y: 92
                  width: 154
                  height: 154
                  radius: 77
                  styles: lid_style
                  clickable: false
                  hidden: true
              - obj:
                  id: bottom_lid_right
                  align: BOTTOM_MID
                  width: 100%
                  height: 20
                  styles: lid_style
                  clickable: false
                  hidden: true
        - label:
            id: face_zzz
            align: TOP_RIGHT
            x: -30
            y: 24
            text: "Z z z"
            text_font: font_small
            hidden: true

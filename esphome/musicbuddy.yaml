    - id: face_page
      skip: true
      scrollable: false
      on_load:
        - lambda: |-
            id(face_visible) = true;
            id(face_mood) = -1;  // force the mood to be applied again
        - script.execute: update_face_mood
      on_unload:
        - lambda: "id(face_visible) = false;"
      on_click:
        - lvgl.page.show: player_page
      widgets:
        # Eyes are not clickable so a tap anywhere reaches the page
        - obj:
            id: left_eye
            align: CENTER
            x: -${eye_offset_x}
            y: ${eye_offset_y}
            width: ${eye_size}
            height: ${eye_size}
            styles: eye_style
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  id: pupil_left
                  align: CENTER
                  width: ${pupil_size}
                  height: ${pupil_size}
                  radius: ${pupil_radius}
                  styles: lid_style
                  scrollable: false
                  clickable: false
                  widgets:
                    # Glint: small highlight in the upper right of the pupil
                    - obj:
                        align: TOP_RIGHT
                        x: -5
                        y: 5
                        width: ${glint_size}
                        height: ${glint_size}
                        radius: 5
                        bg_color: ${eye_color}
                        bg_opa: COVER
                        border_width: 0
                        clickable: false
              - obj:
                  id: top_lid_left
                  align: TOP_MID
                  width: 100%
                  height: 40
                  styles: lid_style
                  clickable: false
                  hidden: true
              # Slanted lids: an 80 px thick line centred over the 85 px eye (x -23 .. 107) so both
              # eyes mirror each other; cut about 5 px at the shallow end to 31 px, pupil stays clear
              - line:
                  id: angry_lid_left
                  x: -23
                  y: -42
                  points:
                    - 0, 0
                    - 130, 40
                  line_width: 80
                  # Round ends: a square-cut end left one eye corner uncovered
                  line_rounded: true
                  line_color: 0x000000
                  clickable: false
                  hidden: true
              - line:
                  id: sad_lid_left
                  x: -23
                  y: -42
                  points:
                    - 0, 40
                    - 130, 0
                  line_width: 80
                  # Round ends: a square-cut end left one eye corner uncovered
                  line_rounded: true
                  line_color: 0x000000
                  clickable: false
                  hidden: true
              # Happy: a 120 px "cheek" circle cuts 20 px out of the eye bottom
              - obj:
                  id: cheek_lid_left
                  align: TOP_MID
                  y: 64
                  width: 120
                  height: 120
                  radius: 60
                  styles: lid_style
                  clickable: false
                  hidden: true
              - obj:
                  id: bottom_lid_left
                  align: BOTTOM_MID
                  width: 100%
                  height: 20
                  styles: lid_style
                  clickable: false
                  hidden: true
        - obj:
            id: right_eye
            align: CENTER
            x: ${eye_offset_x}
            y: ${eye_offset_y}
            width: ${eye_size}
            height: ${eye_size}
            styles: eye_style
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  id: pupil_right
                  align: CENTER
                  width: ${pupil_size}
                  height: ${pupil_size}
                  radius: ${pupil_radius}
                  styles: lid_style
                  scrollable: false
                  clickable: false
                  widgets:
                    # Glint: small highlight in the upper right of the pupil
                    - obj:
                        align: TOP_RIGHT
                        x: -5
                        y: 5
                        width: ${glint_size}
                        height: ${glint_size}
                        radius: 5
                        bg_color: ${eye_color}
                        bg_opa: COVER
                        border_width: 0
                        clickable: false
              - obj:
                  id: top_lid_right
                  align: TOP_MID
                  width: 100%
                  height: 40
                  styles: lid_style
                  clickable: false
                  hidden: true
              # Slanted lids: see left eye
              - line:
                  id: angry_lid_right
                  x: -23
                  y: -42
                  points:
                    - 0, 40
                    - 130, 0
                  line_width: 80
                  # Round ends: a square-cut end left one eye corner uncovered
                  line_rounded: true
                  line_color: 0x000000
                  clickable: false
                  hidden: true
              - line:
                  id: sad_lid_right
                  x: -23
                  y: -42
                  points:
                    - 0, 0
                    - 130, 40
                  line_width: 80
                  # Round ends: a square-cut end left one eye corner uncovered
                  line_rounded: true
                  line_color: 0x000000
                  clickable: false
                  hidden: true
              # Happy: a 120 px "cheek" circle cuts 20 px out of the eye bottom
              - obj:
                  id: cheek_lid_right
                  align: TOP_MID
                  y: 64
                  width: 120
                  height: 120
                  radius: 60
                  styles: lid_style
                  clickable: false
                  hidden: true
              - obj:
                  id: bottom_lid_right
                  align: BOTTOM_MID
                  width: 100%
                  height: 20
                  styles: lid_style
                  clickable: false
                  hidden: true
        # Happy: smile (lower part of a circle, thin stroke with round ends)
        - arc:
            id: face_mouth
            align: CENTER
            x: 0
            y: 36
            width: 68
            height: 68
            start_angle: 35
            end_angle: 145
            adjustable: false
            clickable: false
            hidden: true
            arc_color: ${eye_color}
            arc_width: 7
            arc_rounded: true
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            indicator:
              arc_opa: TRANSP
            knob:
              bg_opa: TRANSP
              pad_all: 0
        - label:
            id: face_zzz
            align: TOP_RIGHT
            x: -30
            y: 24
            text: "Z z z"
            text_font: font_small
            hidden: true

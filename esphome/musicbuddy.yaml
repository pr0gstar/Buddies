# ---------------------------------------------------------------------------
# UI: player, music/audio story picker, favourites per category
# ---------------------------------------------------------------------------
lvgl:
  buffer_size: 12%
  bg_color: 0x000000
  text_color: 0xFFFFFF
  on_idle:
    - timeout: ${idle_timeout}
      then:
        - lvgl.page.show: face_page
        - light.turn_on:
            id: display_backlight
            brightness: !lambda return ${idle_brightness} * id(ambient_factor);
    - timeout: ${off_timeout}
      then:
        - light.turn_off: display_backlight

  style_definitions:
    - id: eye_style
      bg_color: ${eye_color}
      bg_opa: COVER
      # Black border drawn after the lids: hides the bright edge arc
      # that otherwise stays visible as a thin line at the covered corners
      border_width: 2
      border_color: 0x000000
      border_post: true
      radius: ${eye_radius}
      pad_all: 0
      clip_corner: true
    - id: lid_style
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    # Tile: dark grey area without border (iOS style), cover/icon centred.
    # The covers are the only colour on the screen.
    - id: tile_style
      bg_color: 0x1C1C1E
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      radius: 16
      pad_all: 0
      text_color: 0xFFFFFF
    # Round buttons (back, next, volume down, volume up)
    - id: round_button
      bg_color: 0x2C2C2E
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      pad_all: 0
      text_color: 0xFFFFFF
    # Transport buttons without background: icon only, like Apple Music
    - id: bare_button
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      pad_all: 0
      text_color: 0xFFFFFF
    # Inner field (64 px) for icons, in place of a cover
    - id: inner_square
      bg_color: 0x2C2C2E
      bg_opa: COVER
      border_width: 0
      radius: 10
      pad_all: 0
    # Covers in tiles: rounded. Without clip_corner: that forces LVGL into its own layer on every redraw
    # (e.g. when the tile is pressed), whose memory briefly showed noise.
    # LVGL 9 rounds images via radius alone.
    - id: cover_style
      radius: 10

  # All buttons: slightly brighter while pressed (visible feedback)
  theme:
    button:
      bg_color: 0x1C1C1E
      border_width: 0
      shadow_width: 0
      text_color: 0xFFFFFF
      pressed:
        bg_color: 0x3A3A3C
        bg_opa: COVER

  # Lock: invisible layer above everything, swallows every touch
  top_layer:
    widgets:
      - obj:
          id: lock_overlay
          x: 0
          y: 0
          width: 320
          height: 240
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          radius: 0
          hidden: true
          clickable: true
          scrollable: false
          widgets:
            - image:
                align: BOTTOM_RIGHT
                x: -6
                y: -6
                src: icon_lock
                image_recolor: 0xFFFFFF
                image_recolor_opa: COVER
                opa: 60%
                clickable: false
  pages:
    # ---------------- Player ----------------
    - id: player_page
      widgets:
        # Tapping the cover opens the music/audio story picker
        - obj:
            x: 16
            y: 16
            width: 112
            height: 112
            radius: 14
            bg_color: 0x1C1C1E
            border_width: 0
            pad_all: 0
            scrollable: false
            on_click:
              - lvgl.page.show: choose_page
            widgets:
              # Without a known cover: note icon in grey
              - label:
                  align: CENTER
                  text: "\uF001"
                  text_font: montserrat_48
                  text_color: 0x8E8E93
                  clickable: false
              - image:
                  id: cover_widget
